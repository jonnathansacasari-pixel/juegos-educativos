<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Colorea</title>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../kit.css"></head><body>
<div class="top-nav"><a href="../index.html" class="btn-home">🏠 Menú</a><span class="title">🖍️ Colorea</span>
<button class="btn-clear" onclick="toggleModoLibre()" id="btnModo">🎨 Dibujo Libre</button>
<button class="btn-clear" onclick="reiniciar()">🔄</button></div>

<div class="selector" id="secSelector">
  <button class="flecha" onclick="cambiar(-1)">⬅️</button>
  <span id="nom" class="nom"></span>
  <button class="flecha" onclick="cambiar(1)">➡️</button>
</div>

<svg id="dib" viewBox="0 0 400 260"></svg>

<div id="contenedorCanvas" style="display:none; margin: 10px auto; text-align:center;">
  <canvas id="paintCanvas" width="500" height="320" style="background:white; border:5px solid #854d0e; border-radius:20px; touch-action:none; cursor:crosshair; box-shadow:0 8px 16px rgba(0,0,0,0.15);"></canvas>
  <div style="margin-top:10px; display:flex; gap:10px; justify-content:center;">
    <button class="btn-clear" onclick="setGrosor(6)">✏️ Pincel Fino</button>
    <button class="btn-clear" onclick="setGrosor(18)">🖌️ Pincel Grueso</button>
    <button class="btn-clear" onclick="usarBorrador()">🧽 Borrador</button>
    <button class="btn-clear" onclick="limpiarCanvasLibre()">🧹 Limpiar Hoja</button>
  </div>
</div>

<div class="paleta" id="paleta"></div>
<script src="../kit.js"></script><script src="script.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => { if (window.decir) window.decir("¡Bienvenido a Colorea y Dibujo Libre!"); }, 600);
  });
</script></body></html>
